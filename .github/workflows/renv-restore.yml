name: renv restore

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Install renv
        shell: Rscript {0}
        run: install.packages("renv")

      - name: Cache renv packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/R/cache/R/renv' || '~/Library/Caches/org.R-project.R/R/renv' }}
          key: renv-${{ runner.os }}-4.6-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-4.6-

      - name: Restore renv library
        shell: Rscript {0}
        run: renv::restore()
